schema: spec-driven

context: |
  Учебный проект: спецификация справочника имён и телефонов.
  Исходный источник: original_requirements.txt; не изменять его при уточнении требований.
  Объяснять пользователю новые термины простыми словами на русском языке.
  Спецификация подготовлена к итоговому просмотру; реализации ещё нет.
  Согласовано: первая итерация использует SQL БД SQLite.
  В перспективе возможна разработка собственного движка БД и приложения.
  Собственный движок не входит в первую итерацию; его создание пока не запланировано.
  Выбрано при отсутствии предпочтений пользователя: Python, интерфейс в браузере, HTTP API с JSON.
  Пользователь сообщил, что замечаний к черновику нет; правила данных и поиска приняты.
  Масштаб, указанный пользователем: тысячи записей.
  Выбранная методика приёмки: 10 000 записей, полный результат поиска за 1 секунду.
  Проверочный объём не является верхним пределом хранения.
  Детали методики и окружения находятся в design.md; новые допущения явно обозначать.
